# wrangler.toml
name = "kora-embedder-bot"
main = "worker.js"
compatibility_date = "2026-10-12"
workers_dev = true

[vars]
ENV_LIST_URL = "https://raw.githubusercontent.com/MarcOlle/kora-embedder-bot/main/list.json"

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...
